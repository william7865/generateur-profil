<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur de profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono&display=swap">
<style>
  :root {
    --bg: #f8fafd; --card: #ffffff; --text: #1f1f1f; --muted: #5f6368;
    --line: #e1e3e1; --outline: #747775; --primary: #0b57d0; --on-primary: #ffffff;
    --tonal: #d3e3fd; --on-tonal: #041e49; --hover: rgba(11, 87, 208, .08);
    --danger: #b3261e; --snack: #303030; --on-snack: #f2f2f2;
    --shadow: 0 1px 2px rgba(60, 64, 67, .16), 0 1px 3px 1px rgba(60, 64, 67, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131314; --card: #1e1f20; --text: #e3e3e3; --muted: #c4c7c5;
      --line: #3c4043; --outline: #8e918f; --primary: #a8c7fa; --on-primary: #062e6f;
      --tonal: #004a77; --on-tonal: #c2e7ff; --hover: rgba(168, 199, 250, .1);
      --danger: #f2b8b5; --snack: #e3e3e3; --on-snack: #1f1f1f;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 16px 96px; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  h1 { font-size: 32px; line-height: 1.25; font-weight: 400; margin: 0 0 8px; }
  header p { margin: 0; color: var(--muted); }
  h2 { font-size: 20px; line-height: 1.3; font-weight: 400; margin: 0; }
  .card {
    background: var(--card); border-radius: 24px; padding: 8px 24px 24px;
    margin-bottom: 24px; box-shadow: var(--shadow);
  }

  .field {
    display: grid; grid-template-columns: 180px 1fr auto auto; gap: 8px;
    align-items: center; min-height: 64px; padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .field .label, .meta { color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .02em; }
  .value { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  #v-mdp, .mono { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Boutons : texte par défaut, puis variantes pleine / tonale / contour */
  button, a.bouton {
    font: inherit; font-weight: 500; color: var(--primary); background: transparent;
    border: 1px solid transparent; border-radius: 100px; min-height: 40px; padding: 0 16px;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    justify-content: center; white-space: nowrap; transition: background-color .15s, box-shadow .15s;
  }
  button:hover, a.bouton:hover { background: var(--hover); }
  button:focus-visible, a.bouton:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  button.primary { background: var(--primary); color: var(--on-primary); padding: 0 24px; }
  button.primary:hover { background: var(--primary); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
  #enregistrer { background: var(--tonal); color: var(--on-tonal); padding: 0 24px; }
  #enregistrer:hover { background: var(--tonal); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
  a.bouton, .head button { border-color: var(--outline); }
  button.danger { color: var(--danger); }
  button[data-regen] { width: 40px; padding: 0; font-size: 20px; color: var(--muted); }

  .options {
    display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center;
    padding: 16px 0; color: var(--muted);
  }
  .options label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .options input { accent-color: var(--primary); }
  .options input[type="checkbox"] { width: 18px; height: 18px; }
  .options output { color: var(--text); min-width: 2ch; font-variant-numeric: tabular-nums; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  input[type="text"] {
    order: -1; flex: 1 1 100%; font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--outline); border-radius: 8px; height: 52px; padding: 0 16px;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
  .actions a.bouton { margin-left: auto; }

  .head {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: space-between; padding: 16px 0 12px;
  }
  .head div { display: flex; gap: 8px; }
  .avert {
    margin: 0 0 8px; padding: 12px 16px; border-radius: 12px;
    background: var(--tonal); color: var(--on-tonal); font-size: 12px;
  }
  .vide { color: var(--muted); text-align: center; padding: 32px 0 16px; margin: 0; }

  .compte { padding: 16px 0; border-top: 1px solid var(--line); }
  .compte:first-child { border-top: 0; }
  .compte .top { display: flex; gap: 16px; align-items: center; margin-bottom: 4px; }
  .avatar {
    flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--primary);
    color: var(--on-primary); display: grid; place-items: center; font-weight: 500;
  }
  .compte .qui { display: flex; flex-direction: column; min-width: 0; }
  .compte .nom { font-weight: 500; overflow-wrap: anywhere; }
  .compte .ligne {
    display: grid; grid-template-columns: 124px 1fr auto auto; gap: 8px;
    align-items: center; margin-left: 56px; min-height: 40px;
  }
  .compte .ligne > button:only-child { justify-self: start; margin-left: -16px; }
  .compte button { min-height: 36px; }

  #message {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--snack); color: var(--on-snack); padding: 12px 20px; border-radius: 8px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .3); max-width: calc(100vw - 32px); z-index: 10;
  }
  #message:empty { display: none; }

  @media (max-width: 600px) {
    body { padding-top: 32px; }
    .card { padding: 8px 16px 16px; border-radius: 20px; }
    .field { grid-template-columns: 1fr auto auto; }
    .field .label { grid-column: 1 / -1; margin-bottom: -8px; }
    .compte .ligne { grid-template-columns: 1fr auto auto; margin-left: 0; }
    .compte .ligne .meta { grid-column: 1 / -1; margin-bottom: -8px; }
    .actions a.bouton { margin-left: 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Générateur de profil</h1>
    <p>Nom, prénom, date de naissance et mot de passe aléatoires</p>
  </header>

  <section class="card">
    <div class="field"><span class="label">Nom</span><span class="value" id="v-nom"></span>
      <button data-copier="nom">Copier</button><button data-regen="nom" title="Régénérer le nom">↻</button></div>
    <div class="field"><span class="label">Prénom</span><span class="value" id="v-prenom"></span>
      <button data-copier="prenom">Copier</button><button data-regen="prenom" title="Régénérer le prénom">↻</button></div>
    <div class="field"><span class="label">Date de naissance</span><span class="value" id="v-naissance"></span>
      <button data-copier="naissance">Copier</button><button data-regen="naissance" title="Régénérer la date">↻</button></div>
    <div class="field"><span class="label">Mot de passe</span><span class="value" id="v-mdp"></span>
      <button data-copier="mdp">Copier</button><button data-regen="mdp" title="Régénérer le mot de passe">↻</button></div>

    <div class="options">
      <label>Longueur <input type="range" id="longueur" min="8" max="32" value="16"><output id="longueur-val">16</output></label>
      <label><input type="checkbox" id="chiffres" checked> Chiffres</label>
      <label><input type="checkbox" id="symboles" checked> Symboles</label>
    </div>

    <div class="actions">
      <button class="primary" id="tout">Tout générer</button>
      <input type="text" id="note" placeholder="Note (ex. site où le compte est créé)" maxlength="120">
      <button id="enregistrer">Enregistrer</button>
      <a class="bouton" href="https://accounts.google.com/signup" target="_blank" rel="noopener">Créer un compte Google ↗</a>
    </div>
    <div id="message" role="status"></div>
  </section>

  <section class="card">
    <div class="head">
      <h2>Comptes enregistrés <span class="meta" id="compteur"></span></h2>
      <div>
        <button id="exporter">Exporter</button>
        <button id="importer">Importer</button>
        <input type="file" id="fichier" accept="application/json,.json" hidden>
      </div>
    </div>
    <p class="avert">Stockés en clair dans ce navigateur, sur cet ordinateur uniquement. Pense à exporter pour garder une sauvegarde.</p>
    <div id="liste"></div>
  </section>
</main>

<script>
/* LOGIQUE-DEBUT */
const NOMS = ("Martin Bernard Thomas Petit Robert Richard Durand Dubois Moreau Laurent Simon Michel Lefebvre Leroy Roux David Bertrand Morel Fournier Girard Bonnet Dupont Lambert Fontaine Rousseau Vincent Muller Lefevre Faure Andre Mercier Blanc Guerin Boyer Garnier Chevalier Francois Legrand Gauthier Garcia Perrin Robin Clement Morin Nicolas Henry Roussel Mathieu Gautier Masson Marchand Duval Denis Dumont Marie Lemaire Noel Meyer Dufour Meunier Brun Blanchard Giraud Joly Riviere Lucas Brunet Gaillard Barbier Arnaud Martinez Gerard Roche Renard Schmitt Roy Leroux Colin Vidal Caron Picard Roger Fabre Aubert Lemoine Renaud Dumas Lacroix Olivier Philippe Bourgeois Pierre Benoit Rey Leclerc Payet Rolland Leclercq Guillaume Lecomte Lopez Jean Dupuy Guillot Hubert Berger Carpentier Sanchez Dupuis Moulin Louis Deschamps Huet Vasseur Perez Boucher Fleury Royer Klein Jacquet Adam Paris Poirier Marty Aubry Guyot Carre Charles Renault Charpentier Menard Maillard Baron Bertin Bailly Herve Schneider Fernandez Le Gall Collet Leger Bouvier Julien Prevost Millet Perrot Daniel Le Roux Cousin Germain Breton Besson Langlois Remy Le Goff Pelletier Leveque Perrier Leblanc Barre Lebrun Marchal Weber Mallet Hamon Boulanger Jacob Monnier Michaud Rodriguez Guichard Gillet Etienne Grondin Poulain Tessier Chevallier Collin Chauvin Da Silva Bouchet Gay Lemaitre Benard Marechal Humbert Reynaud Antoine Hoarau Perret Barthelemy Cordier Pichon Lejeune Gilbert Lamy Delaunay Pasquier Carlier Laporte")
  .split(" ").reduce((liste, mot) => {
    // « Le Gall », « Da Silva »… : la particule est recollée au mot suivant
    const dernier = liste[liste.length - 1];
    if (dernier === "Le" || dernier === "Da") liste[liste.length - 1] = dernier + " " + mot;
    else liste.push(mot);
    return liste;
  }, []);

const PRENOMS = "Marie Jeanne Camille Louise Emma Alice Chloé Inès Léa Manon Jade Lina Rose Anna Mila Julia Ambre Zoé Juliette Lou Agathe Léna Romane Nina Eva Charlotte Sarah Margaux Clara Lucie Anaïs Mathilde Pauline Élise Océane Laura Marion Julie Céline Sophie Nathalie Isabelle Valérie Sandrine Caroline Aurélie Émilie Hélène Claire Amandine Mélanie Audrey Justine Morgane Noémie Elsa Capucine Victoire Adèle Margot Clémence Salomé Apolline Constance Éléonore Garance Héloïse Iris Jasmine Lison Maëlle Nora Olivia Romy Suzanne Victoria Yasmine Alix Blanche Céleste Diane Estelle Fanny Gabrielle Hortense Irène Joséphine Léonie Madeleine Ninon Ophélie Perrine Solène Tiphaine Lucas Hugo Louis Gabriel Arthur Jules Raphaël Adam Léo Nathan Ethan Paul Noah Tom Théo Sacha Maël Liam Gabin Timéo Mathis Enzo Axel Antoine Maxime Alexandre Thomas Nicolas Julien Pierre Quentin Baptiste Clément Romain Florian Kevin Guillaume Adrien Benjamin Vincent Sébastien Olivier Laurent Philippe Stéphane Christophe Frédéric David Éric Patrick Michel Alain Jean François Bernard Daniel Jacques Marc Victor Simon Martin Valentin Robin Léon Augustin Oscar Basile Côme Marius Gaspard Eliott Noé Samuel Aaron Malo Ilyes Rayan Yanis Kylian Dylan Mathéo Evan Tristan Corentin Damien Fabien Grégoire Henri Ismaël Joseph Loïc Mickaël Norbert Octave Rémi Sylvain Thibault Xavier Yann Achille Bastien Cédric Denis Émile Félix Gauthier"
  .split(" ");

const MINUSCULES = "abcdefghijklmnopqrstuvwxyz";
const MAJUSCULES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const CHIFFRES = "0123456789";
const SYMBOLES = "!@#$%&*?-_+=";
const JOUR_MS = 86400000;

// Entier uniforme dans [0, max[ — tirage avec rejet pour éviter le biais du modulo
function entierAleatoire(max) {
  const limite = Math.floor(0x100000000 / max) * max;
  const tampon = new Uint32Array(1);
  do { crypto.getRandomValues(tampon); } while (tampon[0] >= limite);
  return tampon[0] % max;
}

function choisir(liste) { return liste[entierAleatoire(liste.length)]; }

function genererNom() { return choisir(NOMS); }
function genererPrenom() { return choisir(PRENOMS); }

function genererMotDePasse(longueur, avecChiffres, avecSymboles) {
  const classes = [MINUSCULES, MAJUSCULES];
  if (avecChiffres) classes.push(CHIFFRES);
  if (avecSymboles) classes.push(SYMBOLES);
  const tous = classes.join("");
  // un caractère garanti par classe, le reste tiré dans l'ensemble, puis mélange
  const car = classes.map(choisir);
  while (car.length < longueur) car.push(choisir(tous));
  for (let i = car.length - 1; i > 0; i--) {
    const j = entierAleatoire(i + 1);
    [car[i], car[j]] = [car[j], car[i]];
  }
  return car.join("");
}

// Date de naissance d'une personne ayant entre 18 et 80 ans à la date `aujourdhui`
function genererNaissance(aujourdhui) {
  const a = aujourdhui.getFullYear(), m = aujourdhui.getMonth(), j = aujourdhui.getDate();
  // un 29 février ramené à une année non bissextile devient le 28, pas le 1er mars
  const anniversaire = (annee) => {
    const t = new Date(Date.UTC(annee, m, j));
    return t.getUTCMonth() === m ? t.getTime() : Date.UTC(annee, m + 1, 0);
  };
  const debut = anniversaire(a - 80);
  const fin = anniversaire(a - 18);
  const jours = Math.round((fin - debut) / JOUR_MS);
  const d = new Date(debut + entierAleatoire(jours + 1) * JOUR_MS);
  const deux = (n) => String(n).padStart(2, "0");
  return deux(d.getUTCDate()) + "/" + deux(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear();
}

// Garde uniquement les comptes bien formés d'un contenu importé ou relu
function validerComptes(donnees) {
  if (!Array.isArray(donnees)) return [];
  const champs = ["id", "nom", "prenom", "naissance", "mdp", "cree"];
  return donnees
    .filter((c) => c && typeof c === "object" && champs.every((k) => typeof c[k] === "string"))
    .map((c) => ({
      id: c.id, nom: c.nom, prenom: c.prenom, naissance: c.naissance, mdp: c.mdp, cree: c.cree,
      note: typeof c.note === "string" ? c.note : "",
    }));
}

function fusionnerComptes(existants, nouveaux) {
  const connus = new Set(existants.map((c) => c.id));
  return existants.concat(nouveaux.filter((c) => !connus.has(c.id)));
}
/* LOGIQUE-FIN */

const CLE = "generateur-profil.comptes";
const $ = (id) => document.getElementById(id);
const profil = { nom: "", prenom: "", naissance: "", mdp: "" };
let comptes = [];
const visibles = new Set();

function message(texte) {
  $("message").textContent = texte;
  clearTimeout(message.minuteur);
  message.minuteur = setTimeout(() => { $("message").textContent = ""; }, 2500);
}

function regenerer(champ) {
  if (champ === "nom") profil.nom = genererNom();
  if (champ === "prenom") profil.prenom = genererPrenom();
  if (champ === "naissance") profil.naissance = genererNaissance(new Date());
  if (champ === "mdp") profil.mdp = genererMotDePasse(Number($("longueur").value), $("chiffres").checked, $("symboles").checked);
  $("v-" + champ).textContent = profil[champ];
}

function toutGenerer() { ["nom", "prenom", "naissance", "mdp"].forEach(regenerer); }

async function copier(texte) {
  try {
    await navigator.clipboard.writeText(texte);
  } catch {
    const zone = document.createElement("textarea");
    zone.value = texte;
    document.body.appendChild(zone);
    zone.select();
    document.execCommand("copy");
    zone.remove();
  }
  message("Copié.");
}

function charger() {
  try { comptes = validerComptes(JSON.parse(localStorage.getItem(CLE) || "[]")); }
  catch { comptes = []; }
}

function sauvegarder() {
  try { localStorage.setItem(CLE, JSON.stringify(comptes)); return true; }
  catch { message("Impossible d'enregistrer : le stockage du navigateur est indisponible."); return false; }
}

function bouton(texte, action, classe) {
  const b = document.createElement("button");
  b.textContent = texte;
  if (classe) b.className = classe;
  b.addEventListener("click", action);
  return b;
}

function ligne(libelle, valeur, affichage, extra) {
  const div = document.createElement("div");
  div.className = "ligne";
  const l = document.createElement("span");
  l.className = "meta";
  l.textContent = libelle;
  const v = document.createElement("span");
  v.className = "value";
  v.textContent = affichage ?? valeur;
  if (libelle === "Mot de passe") v.classList.add("mono");
  div.append(l, v, bouton("Copier", () => copier(valeur)));
  if (extra) div.append(extra);
  return div;
}

function afficherListe() {
  const liste = $("liste");
  liste.replaceChildren();
  $("compteur").textContent = comptes.length ? "(" + comptes.length + ")" : "";
  if (!comptes.length) {
    const p = document.createElement("p");
    p.className = "vide";
    p.textContent = "Aucun compte enregistré pour l'instant.";
    liste.append(p);
    return;
  }
  for (const c of [...comptes].reverse()) {
    const bloc = document.createElement("div");
    bloc.className = "compte";

    const top = document.createElement("div");
    top.className = "top";
    const nom = document.createElement("span");
    nom.className = "nom";
    nom.textContent = c.prenom + " " + c.nom + (c.note ? " — " + c.note : "");
    const date = document.createElement("span");
    date.className = "meta";
    date.textContent = "créé le " + new Date(c.cree).toLocaleDateString("fr-FR");
    const avatar = document.createElement("span");
    avatar.className = "avatar";
    avatar.textContent = (c.prenom[0] || "?").toUpperCase();
    const qui = document.createElement("div");
    qui.className = "qui";
    qui.append(nom, date);
    top.append(avatar, qui);

    const visible = visibles.has(c.id);
    const oeil = bouton(visible ? "Masquer" : "Afficher", () => {
      visible ? visibles.delete(c.id) : visibles.add(c.id);
      afficherListe();
    });
    const suppr = bouton("Supprimer", () => {
      if (!confirm("Supprimer le compte de " + c.prenom + " " + c.nom + " ?")) return;
      comptes = comptes.filter((x) => x.id !== c.id);
      sauvegarder();
      afficherListe();
    }, "danger");

    const actions = document.createElement("div");
    actions.className = "ligne";
    actions.append(suppr);

    bloc.append(
      top,
      ligne("Nom", c.nom),
      ligne("Prénom", c.prenom),
      ligne("Né(e) le", c.naissance),
      ligne("Mot de passe", c.mdp, visible ? c.mdp : "•".repeat(12), oeil),
      actions
    );
    liste.append(bloc);
  }
}

document.querySelectorAll("[data-regen]").forEach((b) => b.addEventListener("click", () => regenerer(b.dataset.regen)));
document.querySelectorAll("[data-copier]").forEach((b) => b.addEventListener("click", () => copier(profil[b.dataset.copier])));
$("tout").addEventListener("click", toutGenerer);
$("longueur").addEventListener("input", () => { $("longueur-val").textContent = $("longueur").value; regenerer("mdp"); });
$("chiffres").addEventListener("change", () => regenerer("mdp"));
$("symboles").addEventListener("change", () => regenerer("mdp"));

$("enregistrer").addEventListener("click", () => {
  comptes.push({ id: crypto.randomUUID(), ...profil, note: $("note").value.trim(), cree: new Date().toISOString() });
  if (!sauvegarder()) { comptes.pop(); return; }
  $("note").value = "";
  afficherListe();
  toutGenerer();
  message("Compte enregistré.");
});

$("exporter").addEventListener("click", () => {
  if (!comptes.length) { message("Aucun compte à exporter."); return; }
  const url = URL.createObjectURL(new Blob([JSON.stringify(comptes, null, 2)], { type: "application/json" }));
  const lien = document.createElement("a");
  lien.href = url;
  lien.download = "comptes-" + new Date().toISOString().slice(0, 10) + ".json";
  lien.click();
  URL.revokeObjectURL(url);
});

$("importer").addEventListener("click", () => $("fichier").click());
$("fichier").addEventListener("change", async () => {
  const fichier = $("fichier").files[0];
  $("fichier").value = "";
  if (!fichier) return;
  let importes;
  try { importes = validerComptes(JSON.parse(await fichier.text())); }
  catch { message("Fichier illisible : ce n'est pas un export valide."); return; }
  const avant = comptes.length;
  comptes = fusionnerComptes(comptes, importes);
  sauvegarder();
  afficherListe();
  message((comptes.length - avant) + " compte(s) importé(s).");
});

charger();
afficherListe();
toutGenerer();
</script>
</body>
</html>
